name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm -r run lint

  npm-license-checker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter npm-license-checker run coverage

  npm-license-checker-e2e:
    name: npm-license-checker-e2e (${{ matrix.fixture.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - name: pnpm-single
            expect: 'is-number@6.0.0 is-number@7.0.0 is-odd@3.0.1'
          - name: pnpm-workspaces
            expect: 'is-number@6.0.0 is-number@7.0.0 is-odd@3.0.1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter npm-license-checker run build
      - name: Stage fixture outside the repo
        # The action walks up from start-path looking for pnpm-workspace.yaml to
        # locate the workspace root. Against the in-repo fixture path it would
        # now find THIS repo's root pnpm-workspace.yaml and misclassify the
        # fixture; copying it out reproduces a real consumer-repo layout.
        run: cp -R .github/actions/npm-license-checker/src/fixtures/${{ matrix.fixture.name }} "$RUNNER_TEMP/fixture"
      - name: Install fixture deps
        working-directory: ${{ runner.temp }}/fixture
        run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/npm-license-checker
        with:
          start-path: ${{ runner.temp }}/fixture
          dependency-type: production
          details-output-path: /tmp/credits.json
          exclude-packages-starting-with: '@deque/'
      - name: Verify output
        run: |
          test -s /tmp/credits.json
          expected=$(echo "${{ matrix.fixture.expect }}" | tr ' ' '\n' | sort)
          actual=$(jq -r 'keys[]' /tmp/credits.json | sort)
          if ! diff <(echo "$expected") <(echo "$actual"); then
            echo "Expected packages did not match actual output"
            cat /tmp/credits.json
            exit 1
          fi

  a11y-sla-breach-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter a11y-sla-breach-labels run coverage

  bundle-size-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter bundle-size-budget run coverage

  create-temp-package-json-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter create-temp-package-json-v1 run coverage
